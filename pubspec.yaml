name: news_app
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  cached_network_image: ^4.0.4
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_riverpod: ^3.4.3
  http: ^1.6.0
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    # Berisi API key. File ini di-ignore oleh git (lihat .env.example).
    - .env
# Logo aplikasi
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true

  image_path: "assets/logo/ic_launcher.png"

  adaptive_icon_background: "assets/logo/ic_launcher_background.png"
  adaptive_icon_foreground: "assets/logo/ic_launcher_foreground.png"

  adaptive_icon_monochrome: "assets/logo/ic_launcher_monochrome.png"

  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/logo/ic_launcher.png"

# Splash screen native → jalankan: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#DCE3DC"
  image: "assets/logo/ic_launcher_foreground.png"
  android_12:
    color: "#DCE3DC"
    image: "assets/logo/ic_launcher_foreground.png"
    icon_background_color: "#DCE3DC"
  fullscreen: false
